---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: database-1
    ansible_host: "${INSTANCE_IP}"
    ansible_user: "${INSTANCE_USER}"
    instance_gw: "${INSTANCE_GW}"
    ansible_ssh_private_key_file: "${SSH_KEY_PATH}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_password: "${SUDO_PASSWORD}"
    groups:
      - database
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../../pkg/ansible/roles
  config_options:
    defaults:
      remote_tmp: /tmp/ansible
      host_key_checking: false
    privilege_escalation:
      become: true
      become_method: sudo
      become_ask_pass: false
  inventory:
    host_vars:
      database-1:
        ansible_host: "${INSTANCE_IP1}"
        ansible_user: "${INSTANCE_USER}"
        ansible_ssh_private_key_file: "${SSH_KEY_PATH}"
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_password: "${SUDO_PASSWORD}"
        network_interfaces:
          - name: eth0
            addresses:
              - "${INSTANCE_IP1}/24"
            gateway4: "${INSTANCE_GW}"
            nameservers:
              addresses: ["8.8.8.8", "8.8.4.4"]
        instance_role: database
    group_vars:
      all: ../../../pkg/ansible/group_vars/all/
      database: ../../../pkg/ansible/group_vars/database/
  lint:
    enabled: true
verifier:
  name: testinfra
  lint:
    enabled: true