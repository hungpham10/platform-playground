---
- name: Import tidb playbook
  ansible.builtin.import_playbook: boilerplate.yml


- name: Configure TiDB Database Servers
  hosts: database-*
  become: true
  vars:
    instance_role: database

  pre_tasks:
    - name: Include role specific variables
      include_vars:
        dir: "{{ item }}"
        ignore_unknown_extensions: true
        extensions: ['yml', 'yaml']
      loop:
        - "group_vars/all"
        - "group_vars/database"
      tags: ["always"]
  roles:
    - role: ../../roles/tidb
      tags: ["database"]