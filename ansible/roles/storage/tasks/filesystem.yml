---
- name: Create filesystems on devices
  filesystem:
    dev: "{{ item.device }}1"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.opts | default(omit) }}"
  loop: "{{ storage_devices }}"
  when: item.state == 'present'

- name: Create filesystems on logical volumes
  filesystem:
    dev: "/dev/{{ item.vg }}/{{ item.name }}"
    fstype: "{{ item.fstype }}"
  loop: "{{ storage_lvs }}"
  when: item.state == 'present'