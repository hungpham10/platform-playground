---
# DHCP mode: 'server' or 'client'
dhcp_mode: "none"

dhcp_defaults:
  mode: disabled
  interfaces:
    - name: eth1
      subnet: "10.0.0.0"
      netmask: "255.255.255.0"
      range_start: "10.0.0.100"
      range_end: "10.0.0.200"
      router: "10.0.0.1"
      nameservers:
        - "8.8.8.8"
        - "8.8.4.4"
