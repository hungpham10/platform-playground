---
- name: Check if MetalLB is already installed
  ansible.builtin.shell: kubectl get ns metallb-system
  register: metallb_ns_check
  failed_when: false
  changed_when: false
  when: inventory_hostname in groups['masters']

- name: Setup Kubeconfig Link for Root
  file:
    path: /root/.kube
    state: directory
    mode: '0700'

- name: Create Symbolic Link to k0s Admin Config
  file:
    src: "/var/lib/k0s/pki/admin.conf"
    dest: "/root/.kube/config"
    state: link
    force: yes

- name: Install MetalLB Manifests
  ansible.builtin.shell: |
    k0s kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.5/config/manifests/metallb-native.yaml
  when: 
    - inventory_hostname in groups['masters']
    - metallb_ns_check.rc != 0

- name: Wait for MetalLB Controller to be ready
  ansible.builtin.shell: |
    k0s kubectl wait --namespace metallb-system \
                --for=condition=ready pod \
                --selector=component=controller \
                --timeout=120s
  when: inventory_hostname in groups['masters']
  changed_when: false

- name: Configure MetalLB IP Address Pool and L2 Advertisement
  ansible.builtin.shell: |
    k0s kubectl apply -f - <<EOF
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata:
      name: first-pool
      namespace: metallb-system
    spec:
      addresses:
        - {{ metallb_ip_range }}
    ---
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: default-l2-adv
      namespace: metallb-system
    spec:
      ipAddressPools:
        - first-pool
    EOF
  when: inventory_hostname in groups['masters']
