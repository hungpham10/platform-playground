- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0755'
  loop:
    - "{{ prometheus_data_dir }}"
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_binary_dir }}"

- name: Download Prometheus
  get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz"

- name: Extract Prometheus
  unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz"
    dest: "/tmp/"
    remote_src: yes

- name: Copy Prometheus binaries
  copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/{{ item }}"
    dest: "{{ prometheus_binary_dir }}/"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0755'
    remote_src: yes
  loop:
    - prometheus
    - promtool

- name: Create systemd service file
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: '0644'

- name: Render prometheus configuration
  template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus-next.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"

- name: Validate Prometheus configuration file
  command: "{{ prometheus_binary_dir }}/promtool check config {{ prometheus_config_dir }}/prometheus-next.yml"
  register: promtool_check
  failed_when: promtool_check.rc != 0
  changed_when: false

- name: Apply prometheus configuration
  command: "mv {{ prometheus_config_dir }}/prometheus-next.yml {{ prometheus_config_dir }}/prometheus.yml"
  notify: Restart prometheus

- name: Set directory permissions
  file:
    path: "{{ item }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0755'
    state: directory
  loop:
    - "{{ prometheus_data_dir }}"
    - "{{ prometheus_config_dir }}"

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start Prometheus service
  systemd:
    name: prometheus
    state: started
    enabled: yes

- name: Clean up temporary files
  file:
    path: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}"
    state: absent

- name: Clean up downloaded archive
  file:
    path: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz"
    state: absent


- name: Verify Prometheus metrics endpoint
  uri:
    url: "http://localhost:9090/metrics"
    method: GET
    status_code: 200
  register: prometheus_metrics
  failed_when: prometheus_metrics.status != 200

