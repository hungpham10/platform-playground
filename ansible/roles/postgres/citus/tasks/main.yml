---
- name: Verify required packages
  assert:
    that: 
      - ansible_facts.packages[item] is defined
    fail_msg: "Required package {{ item }} is not installed"
    success_msg: "Required package {{ item }} is present"
  loop: "{{ citus_required_packages }}"

- name: Install Citus packages
  package:
    name: "{{ citus_required_packages }}"
    state: present

- name: Configure Citus extension
  postgresql_ext:
    name: citus
    db: postgres
    state: present
    login_user: postgres
  become: true
  become_user: postgres

- name: Set Citus configuration parameters
  postgresql_set:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    db: postgres
    login_user: postgres
  loop: "{{ citus_config_params }}"
  become: true
  become_user: postgres
  notify: restart postgresql

- name: Create distributed tables
  postgresql_query:
    db: postgres
    query: "SELECT create_distributed_table('{{ item.table }}', '{{ item.column }}');"
    login_user: postgres
  loop: "{{ citus_distributed_tables }}"
  become: true
  become_user: postgres
  when: citus_distributed_tables is defined