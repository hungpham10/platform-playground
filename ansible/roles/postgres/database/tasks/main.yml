---
- name: Verify system requirements
  assert:
    that:
      - ansible_memtotal_mb >= (postgres_memory_requirement | default(4096))
    fail_msg: >
      Host does not meet PostgreSQL memory requirement:
      Required={{ postgres_memory_requirement | default(4096) }}MB,
      Found={{ ansible_memtotal_mb }}MB

- name: Verify CPU requirements
  assert:
    that:
      - ansible_processor_vcpus >= (postgres_cpu_requirement | default(2))
    fail_msg: >
      Host does not meet PostgreSQL CPU requirement:
      Required={{ postgres_cpu_requirement | default(2) }} vCPUs,
      Found={{ ansible_processor_vcpus }} vCPUs

- name: Create PostgreSQL directories
  file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  loop:
    - "{{ postgres_config_path }}"
    - "{{ postgres_config_path }}/conf.d"
    - "{{ postgres_data_dir }}"
    - "{{ postgres_backup_dir }}"
    - "{{ postgres_archive_dir }}"

- name: Configure PostgreSQL
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: postgres
    group: postgres
    mode: '0600'
  loop:
    - { src: postgresql.conf.j2, dest: "{{ postgres_config_path }}/postgresql.conf" }
    - { src: pg_hba.conf.j2, dest: "{{ postgres_config_path }}/pg_hba.conf" }
  notify: restart postgresql

- name: Makesure that WAL level must support when setup cluster 
  assert:
    that:
      - postgres_wal_level in ['replica', 'logical']
  when: postgres_replication_role in ['postgres-master', 'postgres-standby']
  notify: restart postgresql

- name: Configure PostgreSQL replication
  template:
    src: postgresql.replication.conf.j2
    dest: "{{ postgres_config_path }}/conf.d/replication.conf"
    owner: postgres
    group: postgres
    mode: '0600'
  when: postgres_replication_role in ['postgres-master', 'postgres-standby']
  notify: restart postgresql

- name: Create standby.signal file
  file:
    path: "{{ postgres_data_dir }}/standby.signal"
    state: touch
    owner: postgres
    group: postgres
    mode: '0644'
  when: postgres_replication_role == 'postgres-standby'

- name: Create failover management scripts
  template:
    src: "{{ item.src }}"
    dest: "{{ postgres_script_dir }}/{{ item.dest }}"
    owner: postgres
    group: postgres
    mode: '0700'
  loop:
    - { src: promote-to-master.sh.j2, dest: promote-to-master.sh }
    - { src: demote-to-standby.sh.j2, dest: demote-to-standby.sh }
    - { src: check-replication.sh.j2, dest: check-replication.sh }
  when: postgres_replication_role in ['postgres-master', 'postgres-standby']

- name: Start and enable PostgreSQL
  systemd:
    name: "{{ postgres_service }}@{{ postgres_version }}-main"
    state: started
    enabled: yes
    daemon_reload: yes

- name: Configure backup system
  include_tasks: backup.yml
  when:
    - postgres_enable_backup | default(true)
    - postgres_replication_role != 'postgres-standby'

- name: Restart PostgreSQL service
  systemd:
    name: "{{ postgres_service }}@{{ postgres_version }}-main"
    state: restarted
    enabled: yes

- name: Wait for PostgreSQL port to be open on master (only on standby)
  wait_for:
    host: "{{ hostvars[groups['postgres-master'][0]]['ansible_host'] }}"
    port: 5432
    delay: 10
    timeout: 300
  when:
    - postgres_replication_role == 'postgres-standby'
    - groups['postgres-master'] is defined
    - groups['postgres-master'] | length > 0

- name: Check if master PostgreSQL is accepting connections
  community.postgresql.postgresql_ping:
    db: postgres
    login_host: "{{ hostvars[groups['postgres-master'][0]]['ansible_host'] }}"
    login_user: "{{ postgres_replication_user }}"
    login_password: "{{ postgres_replication_password }}"
  delegate_to: "{{ inventory_hostname }}"
  run_once: false
  when:
    - postgres_replication_role == 'standby'
    - groups['postgres-master'] is defined
    - groups['postgres-master'] | length > 0
  retries: 30
  delay: 10
  register: pg_ping
  until: pg_ping is success

- name: Setup base backup for standby
  block:
    - name: Create backup directory
      file:
        path: "{{ postgres_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Take base backup from master
      command: >
        pg_basebackup -h {{ hostvars[groups['postgres-master'][0]]['ansible_host'] }}
        -U {{ postgres_replication_user }}
        -D {{ postgres_data_dir }}
        -X stream
        -S {{ inventory_hostname | regex_replace('-', '_') }}_slot
        -R
      become: true
      become_user: postgres
      environment:
        PGPASSWORD: "{{ postgres_replication_password | default ('123456') }}"
      when: postgres_replication_role == 'postgres-standby'
  when:
    - postgres_replication_role == 'postgres-standby'
    - slot_status.query_result[0].active is defined
    - not slot_status.query_result[0].active

- name: Create replication slot on master
  postgresql_slot:
    name: "{{ item | regex_replace('-', '_') }}_slot"
    slot_type: physical
    state: present
  loop: "{{ groups['postgres-standby'] }}"
  when: 
    - postgres_replication_role == 'postgres-master'
    - inventory_hostname == groups['postgres-master'][0]
  become: true
  become_user: postgres

- name: Create replication user on master
  postgresql_user:
    name: "{{ postgres_replication_user }}"
    password: "{{ postgres_replication_password }}"
    role_attr_flags: REPLICATION,LOGIN
    state: present
  when: 
    - postgres_replication_role == 'postgres-master'
    - inventory_hostname == groups['postgres-master'][0]
  become: true
  become_user: postgres
  no_log: true

- name: Set password for postgres user
  postgresql_user:
    name: postgres
    password: "{{ postgres_admin_password }}"
    state: present
  become: true
  become_user: postgres
  no_log: true
  when: 
    - postgres_replication_role != 'postgres-standby'

- name: Create PostgreSQL users
  postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: "{{ item.flags | default('NOSUPERUSER,NOCREATEDB') }}"
    state: present
  loop: "{{ postgres_users | default([]) }}"
  become: true
  become_user: postgres
  no_log: true
  when: 
    - postgres_replication_role != 'postgres-standby'

- name: Create PostgreSQL databases
  postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    encoding: "{{ item.encoding | default('UTF-8') }}"
    template: "{{ item.template | default('template0') }}"
    state: present
  loop: "{{ postgres_databases | default([]) }}"
  become: true
  become_user: postgres

- name: Check if replication slot is active
  community.postgresql.postgresql_query:
    db: postgres
    login_user: postgres
    login_host: "127.0.0.1" 
    login_password: "{{ postgres_admin_password }}"
    query: "SELECT active FROM pg_replication_slots WHERE slot_name = '{{ inventory_hostname | regex_replace('-', '_') }}_slot';"
  register: slot_status
  run_once: true
  when: "'postgres-master' in groups and groups['postgres-master'] | length > 0"

