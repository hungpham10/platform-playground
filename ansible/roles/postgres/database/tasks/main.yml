---
- name: Verify system requirements
  assert:
    that:
      - ansible_memtotal_mb >= (postgres_memory_requirement | default(4096))
      - ansible_processor_vcpus >= (postgres_cpu_requirement | default(2))
    fail_msg: "Host does not meet PostgreSQL requirements"

- name: Create PostgreSQL directories
  file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  loop:
    - "{{ postgres_data_dir }}"
    - "{{ postgres_backup_dir }}"
    - "{{ postgres_archive_dir }}"

- name: Configure PostgreSQL
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: postgres
    group: postgres
    mode: '0600'
  loop:
    - { src: postgresql.conf.j2, dest: "{{ postgres_config_path }}/postgresql.conf" }
    - { src: pg_hba.conf.j2, dest: "{{ postgres_config_path }}/pg_hba.conf" }
  notify: restart postgresql

- name: Configure PostgreSQL replication
  template:
    src: postgresql.replication.conf.j2
    dest: "{{ postgres_config_path }}/conf.d/replication.conf"
    owner: postgres
    group: postgres
    mode: '0600'
  when: postgres_replication_role in ['master', 'standby']
  notify: restart postgresql

- name: Configure recovery for standby
  template:
    src: recovery.conf.j2
    dest: "{{ postgres_data_dir }}/recovery.conf"
    owner: postgres
    group: postgres
    mode: '0600'
  when: postgres_replication_role == 'standby'
  notify: restart postgresql

- name: Create replication slot on master
  postgresql_slot:
    name: "{{ item }}_slot"
    slot_type: physical
    state: present
  loop: "{{ groups['postgres_standby'] }}"
  when: 
    - postgres_replication_role == 'master'
    - inventory_hostname == groups['postgres_master'][0]
  become: true
  become_user: postgres

- name: Create replication user on master
  postgresql_user:
    name: "{{ postgres_replication_user }}"
    password: "{{ postgres_replication_password }}"
    role_attr_flags: REPLICATION,LOGIN
    state: present
  when: 
    - postgres_replication_role == 'master'
    - inventory_hostname == groups['postgres_master'][0]
  become: true
  become_user: postgres
  no_log: true

- name: Setup base backup for standby
  block:
    - name: Create backup directory
      file:
        path: "{{ postgres_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Take base backup from master
      command: >
        pg_basebackup -h {{ groups['postgres_master'][0] }}
        -U {{ postgres_replication_user }}
        -D {{ postgres_data_dir }}
        -X stream
        -S {{ inventory_hostname }}_slot
        -R
      become: true
      become_user: postgres
      environment:
        PGPASSWORD: "{{ postgres_replication_password }}"
      when: postgres_replication_role == 'standby'
  when: postgres_replication_role == 'standby'

- name: Create failover management scripts
  template:
    src: "{{ item.src }}"
    dest: "{{ postgres_script_dir }}/{{ item.dest }}"
    owner: postgres
    group: postgres
    mode: '0700'
  loop:
    - { src: promote-to-master.sh.j2, dest: promote-to-master.sh }
    - { src: demote-to-standby.sh.j2, dest: demote-to-standby.sh }
    - { src: check-replication.sh.j2, dest: check-replication.sh }
  when: postgres_replication_role in ['master', 'standby']

- name: Create systemd override directory
  file:
    path: /etc/systemd/system/{{ postgres_service }}@{{ postgres_version }}-main.service.d
    state: directory
    mode: '0755'

- name: Create override.conf for custom config path
  copy:
    dest: /etc/systemd/system/{{ postgres_service }}@{{ postgres_version }}-main.service.d/override.conf
    content: |
      [Unit]
      AssertPathExists=/var/lib/postgresql/%I/postgresql.conf
      RequiresMountsFor=/var/lib/postgresql/%I

      [Service]
      ExecStart=
      ExecStart=/usr/bin/pg_ctlcluster --skip-systemctl-redirect -o "-c config_file=/var/lib/postgresql/%I/postgresql.conf" %i start
  notify: daemon reload

- name: Start and enable PostgreSQL
  systemd:
    name: "{{ postgres_service }}"
    state: started
    enabled: yes
    daemon_reload: yes

- name: Set password for postgres user
  postgresql_user:
    name: postgres
    password: "{{ postgres_admin_password }}"
    state: present
  become: true
  become_user: postgres
  no_log: true

- name: Create PostgreSQL users
  postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: "{{ item.flags | default('NOSUPERUSER,NOCREATEDB') }}"
    state: present
  loop: "{{ postgres_users | default([]) }}"
  become: true
  become_user: postgres
  no_log: true

- name: Create PostgreSQL databases
  postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    encoding: "{{ item.encoding | default('UTF-8') }}"
    template: "{{ item.template | default('template0') }}"
    state: present
  loop: "{{ postgres_databases | default([]) }}"
  become: true
  become_user: postgres

- name: Configure backup system
  include_tasks: backup.yml
  when: postgres_enable_backup | default(true)
