---
- name: Verify required packages
  assert:
    that: 
      - ansible_facts.packages[item] is defined
    fail_msg: "Required package {{ item }} is not installed"
    success_msg: "Required package {{ item }} is present"
  loop: "{{ pgpool_required_packages }}"

- name: Create PgPool directories
  file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  loop:
    - "{{ pgpool_config_dir }}"
    - "{{ pgpool_run_dir }}"
    - "{{ pgpool_log_dir }}"

- name: Configure PgPool
  template:
    src: pgpool.conf.j2
    dest: "{{ pgpool_config_dir }}/pgpool.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: restart pgpool

- name: Configure pool_hba.conf
  template:
    src: pool_hba.conf.j2
    dest: "{{ pgpool_config_dir }}/pool_hba.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: restart pgpool

- name: Configure pool_passwd
  template:
    src: pool_passwd.j2
    dest: "{{ pgpool_config_dir }}/pool_passwd"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: restart pgpool

- name: Configure systemd service
  template:
    src: pgpool.service.j2
    dest: /etc/systemd/system/pgpool.service
    mode: '0644'
  notify: restart pgpool

- name: Start and enable PgPool
  systemd:
    name: pgpool
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for PgPool to be ready
  wait_for:
    host: "{{ pgpool_listen_address }}"
    port: "{{ pgpool_port }}"
    timeout: 30