---
- name: Create PgPool directories
  file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  loop:
    - "{{ pgpool_config_dir }}"
    - "{{ pgpool_run_dir }}"
    - "{{ pgpool_log_dir }}"

- name: Configure PgPool
  template:
    src: pgpool.conf.j2
    dest: "{{ pgpool_config_dir }}/pgpool.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: restart pgpool

- name: Configure pool_hba.conf
  template:
    src: pool_hba.conf.j2
    dest: "{{ pgpool_config_dir }}/pool_hba.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: restart pgpool

- name: Configure pool_passwd
  template:
    src: pool_passwd.j2
    dest: "{{ pgpool_config_dir }}/pool_passwd"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: restart pgpool

- name: Wait for PgPool to be ready
  wait_for:
    host: "{{ pgpool_listen_address }}"
    port: "{{ pgpool_port }}"
    timeout: 30
