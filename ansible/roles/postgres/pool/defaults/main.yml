---
pgpool_config_dir: /etc/pgpool2
pgpool_run_dir: /var/run/pgpool
pgpool_log_dir: /var/log/pgpool

# Connection settings
pgpool_listen_address: '*'
pgpool_port: 6432
pgpool_socket_dir: /var/run/postgresql

# Backend nodes configuration
pgpool_backends: |
  [{% for host in groups['postgres-nodes'] %}
    {
      "host": "{{ hostvars[host]['ansible_host'] }}",
      "port": 5432,
      "weight": 1,
      "data_directory": "{{ postgres_data_dir | default('/var/lib/postgresql/data') }}",
      "flag": "ALLOW_TO_FAILOVER"
    }{% if not loop.last %},{% endif %}
  {% endfor %}]

# Pool settings
pgpool_num_init_children: 32
pgpool_max_pool: 4
pgpool_child_life_time: 300
pgpool_connection_life_time: 0
pgpool_client_idle_limit: 0

# Load balancing settings
pgpool_load_balance_mode: on
pgpool_master_slave_mode: on
pgpool_master_slave_sub_mode: 'stream'

# Authentication
pgpool_enable_pool_hba: on
pgpool_monitor:
  user: "pgpool"
  password: "rootroot"
