---
k8s_version: "1.30"
k8s_build_version: "1.30.7-1.1"
linux_add_packages_keys:
  - key: "https://baltocdn.com/helm/signing.asc"
  - key: "https://download.docker.com/linux/ubuntu/gpg"
  - key: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
  - key: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
linux_add_packages_repositories:
  - repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ansible_distribution_release}} stable"
  - repo: "deb [arch=amd64] https://baltocdn.com/helm/stable/debian/ all main"
  - repo: "deb [arch=amd64] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
linux_add_packages_names:
  - name: nginx
  - name: kubectl
  - name: kubelet
  - name: kubeadm