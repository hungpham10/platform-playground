zookeeper_version: "3.6.2"
zookeeper_home: "/opt/zookeeper"
zookeeper_install_dir: "/opt/zookeeper"
zookeeper_data_dir: "/var/lib/zookeeper"

kafka_minor: "3.2.3"
kafka_major: "2.13"
kafka_home: "/opt/kafka"
kafka_install_dir: "/opt/kafka"
kafka_config_dir: "{{ kafka_install_dir }}/config/legacy"
kafka_data_dir: "/var/lib/kafka"

# Cấu hình kafka brokers
kafka_advertised_listeners: "PLAINTEXT://{{ ansible_default_ipv4.address }}:9092"

# Cấu hình topic
kafka_num_partitions: 3
kafka_default_replication_factor: 3
kafka_offsets_topic_replication_factor: 3
kafka_transaction_state_log_replication_factor: 3
kafka_transaction_state_log_min_isr: 2

# Tối ưu hóa hiệu năng
kafka_num_network_threads: 3
kafka_num_io_threads: 8
kafka_background_threads: 10
kafka_queued_max_requests: 500

# Cấu hình log retention
kafka_log_retention_hours: 168
kafka_log_retention_bytes: -1
kafka_log_segment_bytes: 1073741824
