---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: vpn-server
    image: ubuntu:22.04
    privileged: true
    capabilities:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
  - name: vpn-client
    image: ubuntu:22.04
    privileged: true
    capabilities:
      - NET_ADMIN
provisioner:
  name: ansible
  inventory:
    group_vars:
      vpn_server:
        vpn_mode: server
      vpn_client:
        vpn_mode: client
        wg_server_endpoint: vpn-server
verifier:
  name: ansible