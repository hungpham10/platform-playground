---
- name: Download kafka_exporter binary
  get_url:
    url: "{{ kafka_exporter_download_url }}"
    dest: "/tmp/kafka_exporter.tar.gz"

- name: Unarchive kafka_exporter
  unarchive:
    src: "/tmp/kafka_exporter.tar.gz"
    dest: "/tmp"
    remote_src: yes

- name: Move binary to /usr/local/bin
  copy:
    src: "/tmp/kafka_exporter-{{ kafka_exporter_version }}.linux-amd64/kafka_exporter"
    dest: "/usr/local/bin/kafka_exporter"
    mode: '0755'
    remote_src: yes

- name: Create systemd service file
  template:
    src: kafka-exporter.service.j2
    dest: /etc/systemd/system/kafka-exporter.service
  notify: restart kafka-exporter

- name: Ensure kafka-exporter is started and enabled
  systemd:
    name: kafka-exporter
    state: started
    enabled: yes
    daemon_reload: yes
