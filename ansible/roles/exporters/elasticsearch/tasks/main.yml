---
- name: Download elasticsearch_exporter binary
  get_url:
    url: "{{ es_exporter_download_url }}"
    dest: "/tmp/elasticsearch_exporter.tar.gz"

- name: Unarchive elasticsearch_exporter
  unarchive:
    src: "/tmp/elasticsearch_exporter.tar.gz"
    dest: "/tmp"
    remote_src: yes

- name: Move binary to /usr/local/bin
  copy:
    src: "/tmp/elasticsearch_exporter-{{ es_exporter_version }}.linux-amd64/elasticsearch_exporter"
    dest: "/usr/local/bin/elasticsearch_exporter"
    mode: '0755'
    remote_src: yes

- name: Create systemd service file
  template:
    src: elasticsearch-exporter.service.j2
    dest: /etc/systemd/system/elasticsearch-exporter.service
  notify: restart elasticsearch-exporter

- name: Ensure elasticsearch-exporter is started and enabled
  systemd:
    name: elasticsearch-exporter
    state: started
    enabled: yes
    daemon_reload: yes
