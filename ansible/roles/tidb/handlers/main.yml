---
- name: restart pd-server
  systemd:
    name: pd-server
    state: restarted
  become: true

- name: restart tikv-server
  systemd:
    name: tikv-server
    state: restarted
  become: true

- name: restart tidb-server
  systemd:
    name: tidb-server
    state: restarted
  become: true

- name: reload systemd
  systemd:
    daemon_reload: yes
  become: true