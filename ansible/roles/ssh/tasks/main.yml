
---
- name: Ensure .ssh directory exists on all nodes
  file:
    path: "{{ ssh_home }}/.ssh"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0700'

- name: Configure SSH to skip host key checking (Fix for pgBackRest)
  copy:
    dest: "{{ ssh_home }}/.ssh/config"
    content: |
      Host *
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0600'

- name: Generate SSH key pair once (Only on the first node)
  command: >
    ssh-keygen -t {{ ssh_key_type }} -b {{ ssh_key_size | default(4096) }} 
    -f {{ ssh_home }}/.ssh/{{ ssh_key_name }} -N "" -q
  args:
    creates: "{{ ssh_home }}/.ssh/{{ ssh_key_name }}"
  become_user: "{{ ssh_user }}"
  when: inventory_hostname == ansible_play_hosts[0]

- name: Read the shared keys from the first node
  slurp:
    src: "{{ ssh_home }}/.ssh/{{ item }}"
  register: shared_keys
  loop:
    - "{{ ssh_key_name }}"
    - "{{ ssh_key_name }}.pub"
  when: inventory_hostname == ansible_play_hosts[0]

- name: Distribute shared keys to all nodes
  copy:
    # Sửa: ansible_play_hosts -> ansible_play_hosts
    content: "{{ (hostvars[ansible_play_hosts[0]]['shared_keys']['results'] | selectattr('item', 'equalto', item.name) | first).content | b64decode }}"
    dest: "{{ ssh_home }}/.ssh/{{ item.name }}"
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: "{{ ssh_key_name }}", mode: '0600' }
    - { name: "{{ ssh_key_name }}.pub", mode: '0644' }
  loop_control:
    label: "Syncing {{ item.name }} from {{ ansible_play_hosts[0] }}"

- name: Add shared public key to authorized_keys on all nodes
  ansible.posix.authorized_key:
    user: "{{ ssh_user }}"
    state: present
    key: "{{ (hostvars[ansible_play_hosts[0]]['shared_keys']['results'] | selectattr('item', 'search', '.pub') | first).content | b64decode }}"
    manage_dir: true

- name: Verify SSH connectivity to self and peers
  command: "ssh -o BatchMode=yes -o ConnectTimeout=5 {{ ansible_host }} /bin/true"
  become_user: "{{ ssh_user }}"
  changed_when: false
