- name: Configure named.conf
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/named.conf
    mode: '0640'
  notify: Restart named

- name: Configure zones.conf
  ansible.builtin.template:
    src: zones.conf.j2
    dest: /etc/zones.conf
    mode: '0640'
  notify: Restart named

- name: Ensure named service is enabled and started
  systemd:
    name: named
    state: started
    enabled: true
