- name: Set additional sysctl parameters for DNS performance
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value | string }}"
    state: present
    reload: yes
    sysctl_set: yes
    ignoreerrors: yes
  loop: "{{ sysctl_configs | default([]) }}"
  loop_control:
    label: "{{ item.name }}={{ item.value }}"
