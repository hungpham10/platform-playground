firewall_default_rules:
  search:
    tcp_ports:
      - port: 9114
        comment: "Elasticsearch exporter"
      - port: 9200
        comment: "Elasticsearch http server"
      - port: 9300
        comment: "Elasticsearch xpack server"
      - port: 80
        comment: "http nginx server"
      - port: 443
        comment: "https nginx server"
    udp_ports: []
