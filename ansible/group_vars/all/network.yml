---
# VPC Network Configuration
vpc_networks:
  management:
    cidr: "10.0.0.0/16"
    gateway: "10.0.0.1"
  kubernetes:
    cidr: "172.16.0.0/16"
    gateway: "172.16.0.1"
  data:
    cidr: "192.168.0.0/16"
    gateway: "192.168.0.1"

# Default network configuration
network_defaults:
  is_gateway_machine: false
  enable_forwarding: false
  enable_nat: false
  dhcp_mode: "client"
  ntp_mode: "client"
  vpn_mode: "client"
  domain: "example.com"
  net: "local"

# Default interfaces
network_interfaces:
  - name: eth0
    type: ethernet
    dhcp: false
    addresses:
      - "{{ ansible_host }}/24"
    gateway: "192.168.1.1"
    nameservers:
      addresses: ["8.8.8.8", "8.8.4.4"]

# Default firewall rules
firewall_rules:
  tcp_ports:
    - port: 22
      comment: "SSH"
    - port: 80
      comment: "HTTP"
    - port: 443
      comment: "HTTPS"
  udp_ports:
    - port: 53
      comment: "DNS"
    - port: 123
      comment: "NTP"

# Example cluster nodes configuration
cluster_nodes:
  - hostname: "master01"
    ip: "192.168.1.10"
  - hostname: "worker01" 
    ip: "192.168.1.11"
  - hostname: "worker02"
    ip: "192.168.1.12"