---
# PostgreSQL configuration defaults
postgres_version: "16"
postgres_defaults:
  conf_dir: "/etc/postgresql/{{ postgres_version }}/main"
  data_dir: "/var/lib/postgresql/{{ postgres_version }}/main"
  backup_dir: "/var/lib/postgresql/backup"
  archive_dir: "/var/lib/postgresql/archive"
  max_connections: 100
  shared_buffers: "128MB"
  effective_cache_size: "4GB"
  work_mem: "4MB"
  maintenance_work_mem: "64MB"
  listen_addresses: "*"
  port: 5432
  enable_backup: true
  backup_schedule: "0 1 * * *"
  backup_retention: 7
  backup_compress: true

# Database users
postgres_database_default_users:
  - name: replicator
    password: "{{ postgres_replication_password | default('123456') }}"
    flags: "REPLICATION,LOGIN"

# Databases
postgres_database_default_list: []
