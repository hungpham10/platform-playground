---
# etcd configuration
etcd_defaults:
  cluster_name: pgcluster
  initial_token: etcd-cluster-1
  listen_peer_urls: http://0.0.0.0:2380
  listen_client_urls: http://0.0.0.0:2379

# Patroni configuration
patroni_defaults:
  cluster_name: pgcluster
  scope: postgres
  replication_username: replicator
  replication_password: "{{ vault_patroni_replication_password | default('') }}"
  restapi_username: admin
  restapi_password: "{{ vault_patroni_api_password | default('') }}"

# pgpool configuration
pgpool_defaults:
  virtual_ip: 192.168.1.100
  delegate_ip: 192.168.1.101
  enable_watchdog: true
  master_slave_mode: true
  max_pool: 4
  num_init_children: 32
  connection_life_time: 300
  client_idle_limit: 0

# PostgreSQL analysis settings
postgres_defaults:
  log_dir: /var/log/postgresql
  log_format: csv
  log_min_duration_statement: 1000
  auto_explain_log_min_duration: 3000
