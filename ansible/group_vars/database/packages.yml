---
role_package_key_ids:
  scylladb:
    - keyserver: hkp://keyserver.ubuntu.com:80
      id: a43e06657bac99e3

role_public_signing_keys:
  # ScyllaDB repository GPG keys
  scylladb:
    yum: []
    apt: []

  # PostgreSQL repository GPG keys
  postgres:
    yum: []
    apt:
      - url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
        key: postgresql.asc
        state: present

role_package_repos:
  # ScyllaDB official repositories
  scylladb:
    yum:
      - name: scylladb-2025.3
        description: ScyllaDB baseline
        baseurl: https://downloads.scylladb.com/downloads/scylla/rpm/centos/scylladb-2025.3/$basearch/
        gpgcheck: yes
        enabled: yes
        gpgkey: https://downloads.scylladb.com/downloads/gpg/scylladb-2024-rsa.gpg
      - name: scylla-2025.3-noarch
        description: ScyllaDB generic
        baseurl: https://downloads.scylladb.com/downloads/scylla/rpm/centos/scylladb-2025.3/noarch/
        gpgcheck: yes
        enabled: yes
        gpgkey: https://downloads.scylladb.com/downloads/gpg/scylladb-2024-rsa.gpg
    apt:
      - "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/scylladb.gpg] https://downloads.scylladb.com/downloads/scylla/deb/debian-ubuntu/scylladb-2025.3 stable main"

  # PostgreSQL official repositories
  postgres:
    yum: []
    apt:
      - "deb [signed-by=/usr/share/keyrings/postgresql.asc] http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"

role_packages:
  # Required packages for ScyllaDB database servers
  scylladb:
    yum:
      - scylla
    apt: []

  # Required packages for PostgreSQL database servers
  postgres:
    yum: []
    apt:
      # Core PostgreSQL packages
      - postgresql-{{ postgres_version }}
      - postgresql-client-{{ postgres_version }}
      - postgresql-contrib-{{ postgres_version }}
      - postgresql-{{ postgres_version }}-repack
      - libpq-dev

      # PostgreSQL monitoring and logging
      - pgbadger
      - mailutils
      - postfix

      # Python database adapters
      - python3-psycopg2
      - python3-pip
      
      # Backup and recovery tools
      - pgbackrest
      - barman
      
      # Monitoring and administration
      - pg-activity
      - pgbadger
      - pgtop
      
      # Connection pooling
      - pgpool2
      - postgresql-client    

      # Full text search
      - postgresql-{{ postgres_version }}-rum

      # Performance tools
      - postgresql-{{ postgres_version }}-hypopg
      - postgresql-{{ postgres_version }}-cron
      - postgresql-{{ postgres_version }}-partman

      # Sharding tools
      - postgresql-{{ postgres_version }}-citus
      - citus-toolkit

      # System utilities
      - net-tools
      - iotop
      - sysstat


