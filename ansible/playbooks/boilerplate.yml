---
- name: Configure Base Instance
  hosts: all
  become: true

  pre_tasks:
    - name: Include role specific variables
      include_vars:
        dir: "{{ item }}"
        ignore_unknown_extensions: true
        extensions: ['yml', 'yaml']
      loop:
        - "../group_vars/all"
        - "../group_vars/{{ instance_role }}"
      tags: ["always"]

    - name: Extend existing firewall rules with defaults
      set_fact:
        firewall_rules:
          tcp_ports: >-
            {{ (firewall_rules.tcp_ports | default([]))
               + (firewall_default_rules[subdomain_instance_role | default(instance_role)].tcp_ports | default([]))
               + firewall_base_rules.tcp_ports }}
          udp_ports: >-
            {{ (firewall_rules.udp_ports | default([]))
               + (firewall_default_rules[subdomain_instance_role | default(instance_role)].udp_ports | default([]))
               + firewall_base_rules.udp_ports }}
          custom: >-
            {{ (firewall_rules.custom | default([]))
               + (firewall_default_rules[subdomain_instance_role | default(instance_role)].custom | default([]))
               + firewall_base_rules.custom }}

    - name: Extend existing audit rules with defaults
      set_fact:
        audit_rules: "{{ (audit_rules | default([])) + audit_default_rules }}"

    - name: Extend existing role rules with defaults
      set_fact:
        audit_rules: "{{ (audit_rules | default([])) + audit_default_rules }}"

    - name: Check if host_vars directory exists
      stat:
        path: "host_vars/{{ inventory_hostname }}"
      register: host_vars_dir

    - name: Include host specific variables
      include_vars:
        dir: "host_vars/{{ inventory_hostname }}"
        ignore_unknown_extensions: true
        extensions: ['yml', 'yaml']
      tags: ["always"]
      when: host_vars_dir.stat.exists

  roles:
    - role: sysctl
      vars:
        sysctl_configs: 
          - { name: net.core.rmem_max, value: "16777216" }
          - { name: net.core.wmem_max, value: "16777216" }
          - { name: fs.file-max, value: "2097152" }
          - { name: net.core.somaxconn, value: "65535" }
          - { name: net.ipv4.udp_rmem_min, value: "8192" }
          - { name: net.ipv4.udp_wmem_min, value: "8192" }
          - { name: net.ipv4.ip_local_port_range, value: "1024 65535" }
          - { name: net.ipv4.tcp_rmem, value: "4096 87380 16777216" }
          - { name: net.ipv4.tcp_wmem, value: "4096 65536 16777216" }
          - { name: net.ipv4.tcp_window_scaling, value: "1" }
          - { name: net.ipv4.tcp_fin_timeout, value: "15" }
          - { name: net.ipv4.tcp_keepalive_time, value: "7200" }
          - { name: net.ipv4.tcp_keepalive_intvl, value: "75" }
          - { name: net.ipv4.tcp_keepalive_probes, value: "9" }
          - { name: net.ipv4.tcp_syncookies, value: "1" }
      when: (enable_sysctl | bool)
      tags: ["system"]

    - role: users
      vars:
        linux_groups: >-
          {{ 
            (base_groups | default([])) +
            (role_groups[instance_role] | default([])) +
            (host_specific_groups | default([]))
          }}
        linux_users: >-
          {{
            (base_users | default([])) +
            (role_users[instance_role] | default([])) +
            (host_specific_users | default([]))
          }}
        user_password_salt: "{{ user_password_salt }}"
      tags: ["system", "users", "security"]

    - role: systemd-resolved
      when: (enable_resolver | bool)
      tags: ["system", "network"]

    - role: pkg/yum
      vars:
        linux_add_packages_keys: >-
          {{
            ((base_package_keys.yum | default([])) if (enable_base_package | bool) else []) +
            (
              (role_package_keys[subdomain_instance_role | default(instance_role)].yum | default([]))
            ) +
            (host_package_keys | default([]))
          }}
        linux_add_packages_repositories: >-
          {{
            ((base_package_repos.yum | default([])) if (enable_base_package | bool) else []) +
            (
              (role_package_repos[subdomain_instance_role | default(instance_role)].yum | default([]))
            ) +
            (host_package_repos | default([]))
          }}
        linux_add_packages_names: >-
          {{
            ((base_packages.yum | default([])) if (enable_base_package | bool) else [])+
            (
              (role_packages[subdomain_instance_role | default(instance_role)].yum | default([]))
            ) +
            (host_specific_packages | default([]))
          }}
        linux_add_public_signing_keys: >-
          {{
            ((base_public_signing_keys.yum | default([])) if (enable_base_package | bool) else []) +
            (
              (role_public_signing_keys[subdomain_instance_role | default(instance_role)].yum | default([]))
            ) +
            (host_public_signing_keys | default([]))
          }}
      when: ansible_os_family == "RedHat"
      tags: ["system", "packages"]

    - role: pkg/apt
      vars:
        linux_add_packages_keys: >-
          {{
            ((base_package_keys.apt | default([])) if (enable_base_package | bool) else [])+
            (
              (role_package_keys[subdomain_instance_role | default(instance_role)].apt | default([]))
            ) +
            (host_package_keys | default([]))
          }}
        linux_add_packages_repositories: >-
          {{
            ((base_package_repos.apt | default([])) if (enable_base_package | bool) else [])+
            (
              (role_package_repos[subdomain_instance_role | default(instance_role)].apt | default([]))
            ) +
            (host_package_repos | default([]))
          }}
        linux_add_packages_names: >-
          {{
            ((base_packages.apt | default([])) if (enable_base_package | bool) else [])+
            (
              (role_packages[subdomain_instance_role | default(instance_role)].apt | default([]))
            ) +
            (host_specific_packages | default([]))
          }}
        linux_add_public_signing_keys: >-
          {{
            ((base_public_signing_keys.apt | default([])) if (enable_base_package | bool) else [])+
            (
              (role_public_signing_keys[subdomain_instance_role | default(instance_role)].apt | default([]))
            ) +
            (host_public_signing_keys | default([]))
          }}
        linux_add_packages_key_ids: >-
          {{
            ((base_package_key_ids | default([])) if (enable_base_package | bool) else []) +
            (
              (role_package_key_ids[subdomain_instance_role | default(instance_role)] | default([]))
            ) +
            (host_package_key_ids | default([]))
          }}
      when: ansible_os_family == "Debian"
      tags: ["system", "packages"]

    - role: netplan
      vars:
        is_gateway_machine: "{{ instance_role == 'gateway' }}"
        net_interfaces: "{{ network_interfaces }}"
        enable_forwarding: "{{ network_defaults.enable_forwarding }}"
      when: (enable_netplan | bool)
      tags: ["network"]

    - role: hostname
      vars:
        nodes: >-
          {{
            [{
              'hostname': inventory_hostname,
              'ip': ansible_default_ipv4.address
            }] + 
            (cluster_nodes | default([]))
          }}
      tags: ["network", "hostname"]

    - role: dhcp
      vars:
        dhcp_defaults: "{{ dhcp_configs }}"
        dhcp_enable_auto_provision: "{{ dhcp_configs.enable_auto_provision | default(false) }}"
        dhcp_provision_playbook: "{{ playbook_dir }}/site.yml"
      when: (dhcp_enabled | default(false) | bool) and (dhcp_configs | default([]) | length > 0)
      tags: ["network", "dhcp"]

    - role: firewall
      vars:
        firewall_state: "{{ firewall_defaults.state | default('enabled') }}"
        firewall_enabled: "{{ firewall_defaults.enabled | default(true) }}"
        firewall_policy: "{{ firewall_defaults.policy | default('allow') }}"
        firewall_allowed_tcp_ports: "{{ firewall_rules.tcp_ports | default([]) }}"
        firewall_allowed_udp_ports: "{{ firewall_rules.udp_ports | default([]) }}"
        firewall_additional_rules: "{{ firewall_rules.custom | default([]) }}"
      when: (enable_firewall | bool)
      tags: ["security", "firewall"]

    - role: vpn
      vars:
        vpn_mode: "{{ 'server' if instance_role == 'gateway' else network_defaults.vpn_mode }}"
        vpn_server_endpoint: "{{ vpn_defaults.server_endpoint }}"
        wg_client_address: "{{ vpn_defaults.client_address }}"
        wg_allowed_ips: "{{ vpn_defaults.allowed_ips }}"
      when: (enable_vpn | bool) and (instance_role != 'gateway')
      tags: ["security", "vpn"]

    - role: vpn
      vars:
        vpn_mode: "{{ vpn_defaults.mode }}"
        vpn_server_endpoint: "{{ vpn_defaults.server_endpoint }}"
        wg_client_address: "{{ vpn_defaults.client_address }}"
        wg_allowed_ips: "{{ vpn_defaults.allowed_ips }}"
      when: (enable_vpn | bool) and (instance_role == 'gateway')
      tags: ["security", "vpn"]

    - role: ntp
      vars:
        ntp_mode: "{{ 'server' if instance_role == 'gateway' else ntp_defaults.mode }}"
        ntp_master_server: >-
          {{
            ntp_upstream_servers 
            if instance_role == 'gateway' 
            else (groups['gateway'][0] if (groups['gateway'] is defined and ntp_defaults.use_gateway_server) 
            else ntp_defaults.upstream_servers)
          }}
      when: (enable_ntp | bool)
      tags: ["system", "time"]

    - role: storage
      vars:
        storage_devices: "{{ instance_storage.devices | default([]) }}"
        storage_vgs: "{{ instance_storage.vgs | default([]) }}"
        storage_lvs: "{{ instance_storage.lvs | default([]) }}"
      when: (enable_storage | bool)
      tags: ["storage"]

    - role: audit
      vars:
        audit_rules: "{{ audit_rules | default([]) }}"
        audit_log_path: "{{ audit_log_path | default('/var/log/audit/audit.log') }}"
        audit_max_log_file: "{{ audit_max_log_file | default(8) }}"
        audit_max_log_file_action: "{{ audit_max_log_file_action | default('rotate') }}"
        audit_num_logs: "{{ audit_num_logs | default(5) }}"
        audit_space_left: "{{ audit_space_left | default(75) }}"
        audit_space_left_action: "{{ audit_space_left_action | default('email') }}"
        audit_admin_space_left: "{{ audit_admin_space_left | default(50) }}"
        audit_admin_space_left_action: "{{ audit_admin_space_left_action | default('single') }}"
      when: (enable_audit | bool)
      tags: ["security", "audit"]

    - role: users
      vars:
        linux_groups: >-
          {{ 
            (base_groups | default([])) +
            (role_groups[instance_role] | default([])) +
            (host_specific_groups | default([]))
          }}
        linux_users: >-
          {{
            (base_users | default([])) +
            (role_users[instance_role] | default([])) +
            (host_specific_users | default([]))
          }}
        user_password_salt: "{{ user_password_salt | default(lookup('env', 'USER_PASSWORD_SALT')) }}"
      tags: ["system", "users", "security"]

    - role: hardening
      vars:
        security_required_packages: "{{ security_packages | default([]) }}"
        sysctl_security_params: "{{ sysctl_params | default([]) }}"
        password_policies: "{{ password_default_policies | default([]) }}"
        remove_suid_sgid_files: "{{ suid_sgid_files | default([]) }}"
        enable_aide: "{{ enable_file_integrity | default(false) }}"
        aide_rules: "{{ file_integrity_rules | default([]) }}"
        audit_rules: "{{ system_audit_rules | default([]) }}"
      when: (enable_hardening | bool)
      tags: ["security", "hardening"]

    - role: alloy
      tags: ["monitoring"]

  post_tasks:
    - name: Verify all services are running
      service_facts:
      tags: ["verify"]

    - name: Check service status
      assert:
        that: "{{ role_service_checks[instance_role] | default([]) }}"
        fail_msg: "Some required services are not running"
        success_msg: "All required services are running"
      tags: ["verify"]

    - name: Verify storage configuration
      block:
        - name: Check mount points
          command: findmnt {{ item.mount_point }}
          register: mount_status
          failed_when: false
          changed_when: false
          loop: "{{ instance_storage_devices | default([]) + storage_lvs | default([]) }}"
          when: item.state | default('present') == 'present'

        - name: Verify mounted filesystems
          assert:
            that:
              - "item.rc == 0"
            fail_msg: "Mount point {{ item.item.mount_point }} is not properly configured"
            success_msg: "Mount point {{ item.item.mount_point }} is configured correctly"
          loop: "{{ mount_status.results }}"
          when: item is not skipped
      when: (enable_storage | bool)
      tags: ["verify", "storage"]
