---
- import_playbook: ../../boilerplate.yml

- name: Configure Kafka Instance
  hosts: kafka-*
  become: true
  vars:
    instance_role: eventdriver

  pre_tasks:
    - name: Include role specific variables
      include_vars:
        dir: "{{ item }}"
        ignore_unknown_extensions: true
        extensions: ['yml', 'yaml']
      loop:
        - "../../../group_vars/all"
        - "../../../group_vars/{{ instance_role }}"
      tags: ["always"]

    - name: Check if host_vars directory exists
      ansible.builtin.stat:
        path: "../../../host_vars/{{ inventory_hostname }}"
      register: host_vars_dir
      tags: ["always"]

    - name: Include host specific variables
      include_vars:
        dir: "../../../host_vars/{{ inventory_hostname }}"
        ignore_unknown_extensions: true
        extensions: ['yml', 'yaml']
      when: host_vars_dir.stat.exists
      tags: ["always"]

  roles:
    - role: kafka/legacy
      tags: ["kafka"]

    # Configure Kafka logging
    - role: logrotate
      vars:
        logrotate_custom_entries:
          - name: kafka
            path: "/var/log/kafka.log"
            frequency: daily
            options:
              - rotate 7
              - daily
              - missingok
              - notifempty
              - compress
              - delaycompress
            rsyslog: 
              program_name: kafka-server-start.sh
              id: 30
            create: "0640 root adm"
            postrotate_script: "/usr/lib/rsyslog/rsyslog-rotate"
          - name: zookeeper
            path: "/var/log/zookeeper.log"
            frequency: daily
            options:
              - rotate 7
              - daily
              - missingok
              - notifempty
              - compress
              - delaycompress
            rsyslog: 
              program_name: zkServer.sh
              id: 30
            create: "0640 root adm"
            postrotate_script: "/usr/lib/rsyslog/rsyslog-rotate"
      tags: ["monitoring"]

  post_tasks:
    - name: Test PLAINTEXT port 9092
      ansible.builtin.shell:
        cmd: "/opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ hostvars[groups['kafka-nodes'][0]]['hostname'] | default(hostvars[groups['kafka-nodes'][0]]['inventory_hostname']) }}:9092 --list"
      become_user: kafka
      register: test_plaintext
      changed_when: false

    - name: Test SSL port 9093
      ansible.builtin.shell:
        cmd: "/opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ hostvars[groups['kafka-nodes'][0]]['hostname'] | default(hostvars[groups['kafka-nodes'][0]]['inventory_hostname']) }}:9093 --list --command-config {{ kafka_config_dir }}/client.properties"
      become_user: kafka
      register: test_ssl
      changed_when: false

    - name: Display test results
      debug:
        msg:
          - "PLAINTEXT (9092): {{ 'OK' if test_plaintext.rc == 0 else 'FAILED' }}"
          - "SSL (9093): {{ 'OK' if test_ssl.rc == 0 else 'FAILED' }}"

    - name: Check if failover-test topic exists
      ansible.builtin.shell:
        cmd: "/opt/kafka/bin/kafka-topics.sh --bootstrap-server  {{ hostvars[groups['kafka-nodes'][0]]['hostname'] | default(hostvars[groups['kafka-nodes'][0]]['inventory_hostname']) }}:9092 --list --topic failover-test"
      become_user: kafka
      register: topic_check
      retries: 3
      delay: 5
      until: topic_check.rc == 0
      run_once: true
      changed_when: false
      ignore_errors: true

    - name: Create test topic for failover (replication factor = num controllers)
      ansible.builtin.shell: |
        set -o pipefail
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ hostvars[groups['kafka-nodes'][0]]['hostname'] | default(hostvars[groups['kafka-nodes'][0]]['inventory_hostname']) }}:9092 --create --topic failover-test --partitions 3 --replication-factor {{ groups['controllers'] | length }} --config cleanup.policy=delete
      become_user: kafka
      run_once: true  # Chỉ chạy trên 1 node
      register: topic_create
      failed_when: topic_create.rc != 0 and 'TopicAlreadyExists' not in topic_create.stderr
      when: "'failover-test' not in topic_check.stdout"
    
    - name: Produce test messages
      ansible.builtin.shell: |
        set -o pipefail
        for i in {1..10}; do
          echo "Test message $i" | /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server {{ hostvars[groups['kafka-nodes'][0]]['hostname'] | default(hostvars[groups['kafka-nodes'][0]]['inventory_hostname']) }}:9092 --topic failover-test
        done
      become_user: kafka
      run_once: true
      register: produce_result

    - name: Consume and verify messages before failover
      ansible.builtin.shell: |
        set -o pipefail
        /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server {{ hostvars[groups['kafka-nodes'][0]]['hostname'] | default(hostvars[groups['kafka-nodes'][0]]['inventory_hostname']) }}:9092 --topic failover-test --from-beginning --max-messages 10
      become_user: kafka
      run_once: true
      register: consume_before
      changed_when: false
 
    - name: Debug pre-failover consumption
      ansible.builtin.debug:
        msg: "Messages before failover: {{ consume_before.stdout_lines }}"

    - name: Test if SSL is enabled
      block:
        - name: Test message production via SSL
          ansible.builtin.shell:
            cmd: |
              echo "SSL test message $(date)" | /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server {{ hostvars[groups['kafka-nodes'][0]]['hostname'] | default(hostvars[groups['kafka-nodes'][0]]['inventory_hostname']) }}:9093 \
                --topic failover-test \
                --producer.config {{ kafka_config_dir }}/client.properties
          become_user: kafka
          register: ssl_produce_test
          changed_when: false
        
        - name: Test message consumption via SSL
          ansible.builtin.shell:
            cmd: |
              timeout 10s /opt/kafka/bin/kafka-console-consumer.sh \
                --bootstrap-server {{ hostvars[groups['kafka-nodes'][0]]['hostname'] | default(hostvars[groups['kafka-nodes'][0]]['inventory_hostname']) }}:9093 \
                --topic failover-test \
                --from-beginning \
                --max-messages 1 \
                --consumer.config {{ kafka_config_dir }}/client.properties
          become_user: kafka
          register: ssl_consume_test
          changed_when: false
          failed_when: false
        
        - name: Display consumption test result
          debug:
            msg: "SSL consumption test: {{ 'SUCCESS' if ssl_consume_test.rc == 0 else 'NO MESSAGES' }} - {{ ssl_consume_test.stdout }}"

        - name: Test broker connection via SSL from all nodes
          ansible.builtin.shell:
            cmd: |
              /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server {{ hostvars[groups['kafka-nodes'][0]]['hostname'] | default(hostvars[groups['kafka-nodes'][0]]['inventory_hostname']) }}:9093 \
                --command-config {{ kafka_config_dir }}/client.properties
          become_user: kafka
          register: broker_api_test
          changed_when: false
        
        - name: Display broker API versions
          debug:
            msg: "Broker API versions test: {{ 'SUCCESS' if broker_api_test.rc == 0 else 'FAILED' }}"
      when:
