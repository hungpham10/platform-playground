---
- import_playbook: ../../boilerplate.yml

- name: Configure Kafka Instance
  hosts: all
  become: true
  vars:
    instance_role: eventdriver
    subdomain_instance_role: kafka
    use_ssl: false
    kafka_listeners:
      internal: "INTERNAL://0.0.0.0:9094"
      broker: "EXTERNAL://0.0.0.0:9092"
      #load_balancer: "LOAD_BALANCER://0.0.0.0:9095"
    kafka_advertised_listeners: "EXTERNAL://{{ full_hostname | default(ansible_default_ipv4.address) }}:9092,INTERNAL://{{ full_hostname | default(ansible_default_ipv4.address) }}:9094"
    kafka_listener_security_protocol_map: "EXTERNAL:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
    kafka_sasl_mechanism:
      broker: SCRAM-SHA-512
      load_balancer: SCRAM-SHA-512
    kafka_admin:
      user: "admin"
      password: "rootroot"
    #kafka_external_advertized_listeners: "LOAD_BALANCER://124.197.22.40:9095"
    kafka_inter_broker_listener_name: "INTERNAL"
    kafka_application: []
    kafka_plantext_port: 9092
    kafka_sasl_port: 9094
    kafka_sasl_client_config: "/tmp/client-sasl.properties"
    kafka_sasl_admin_config: "/tmp/admin-sasl.properties"
    test_user: "testuser"
    test_password: "testpass123"
    instance_role: eventdriver
    subdomain_instance_role: kafka

  pre_tasks:
    - name: Include role specific variables
      include_vars:
        dir: "{{ item }}"
        ignore_unknown_extensions: true
        extensions: ['yml', 'yaml']
      loop:
        - "../../../group_vars/all"
        - "../../../group_vars/{{ instance_role }}"
      tags: ["always"]

    - name: Check if host_vars directory exists
      ansible.builtin.stat:
        path: "../../../host_vars/{{ inventory_hostname }}"
      register: host_vars_dir
      tags: ["always"]

    - name: Include host specific variables
      include_vars:
        dir: "../../../host_vars/{{ inventory_hostname }}"
        ignore_unknown_extensions: true
        extensions: ['yml', 'yaml']
      when: host_vars_dir.stat.exists
      tags: ["always"]

  roles:
    - role: kafka/legacy
      vars:
        kafka_data_dir: "/kafka/kafka-data"
        zookeeper_data_dir: "/kafka/zookeeper-snapshot"
      tags: ["kafka"]

    # Configure Kafka logging
    - role: logrotate
      vars:
        logrotate_custom_entries:
          - name: kafka
            path: "/var/log/kafka.log"
            frequency: daily
            options:
              - rotate 7
              - daily
              - missingok
              - notifempty
              - compress
              - delaycompress
            rsyslog: 
              program_name: kafka-server-start.sh
              id: 30
            create: "0640 root adm"
            postrotate_script: "/usr/lib/rsyslog/rsyslog-rotate"

          - name: zookeeper
            path: "/var/log/zookeeper.log"
            frequency: daily
            options:
              - rotate 7
              - daily
              - missingok
              - notifempty
              - compress
              - delaycompress
            rsyslog: 
              program_name: zkServer.sh
              id: 30
            create: "0640 root adm"
            postrotate_script: "/usr/lib/rsyslog/rsyslog-rotate"
      tags: ["monitoring"]

  post_tasks:
    - name: Test port sasl (auth + ACL restriction)
      block:
        - name: Create SASL admin config
          ansible.builtin.copy:
            dest: "{{ kafka_sasl_admin_config }}"
            content: |
              security.protocol=SASL_PLAINTEXT
              sasl.mechanism={{ kafka_sasl_mechanism.broker }}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
                username="{{ kafka_admin.user }}" \
                password="{{ kafka_admin.password }}";
            mode: '0600'
            owner: kafka
          run_once: true

        - name: Create SASL client config (ban đầu dùng admin)
          ansible.builtin.copy:
            dest: "{{ kafka_sasl_client_config }}"
            content: |
              security.protocol=SASL_PLAINTEXT
              sasl.mechanism={{ kafka_sasl_mechanism.broker }}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
                username="{{ kafka_admin.user }}" \
                password="{{ kafka_admin.password }}";
            mode: '0600'
            owner: kafka
          run_once: true

        # Dùng admin để tạo topic nếu chưa có (SASL)
        - name: Ensure failover-test topic exists via SASL (admin)
          ansible.builtin.shell: |
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }} \
              --create --topic failover-test --partitions 3 \
              --replication-factor {{ groups['kafka-nodes'] | length }} \
              --config cleanup.policy=delete \
              --command-config {{ kafka_sasl_admin_config }}
          become_user: kafka
          run_once: true
          register: topic_create_sasl
          failed_when: topic_create_sasl.rc != 0 and 'TopicAlreadyExists' not in topic_create_sasl.stderr|default('')
          ignore_errors: true  # Nếu đã tồn tại từ plaintext test thì ok

        # Tạo SCRAM user testuser
        - name: Create SCRAM user testuser
          ansible.builtin.shell: |
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }} \
              --alter --add-config 'SCRAM-SHA-512=[password={{ test_password }}]' \
              --entity-type users --entity-name {{ test_user }} \
              --command-config {{ kafka_sasl_admin_config }}
          become_user: kafka
          run_once: true
          ignore_errors: true  # Idempotent

        # Chuyển client config sang dùng testuser (chưa có ACL)
        - name: Switch client config to testuser (no ACL yet)
          ansible.builtin.copy:
            dest: "{{ kafka_sasl_client_config }}"
            content: |
              security.protocol=SASL_PLAINTEXT
              sasl.mechanism={{ kafka_sasl_mechanism.broker }}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
                username="{{ test_user }}" \
                password="{{ test_password }}";
            mode: '0600'
            owner: kafka
          run_once: true

        # Thử produce → PHẢI THẤT BẠI (no ACL)
        - name: "[TEST 1] Produce with testuser - EXPECT FAIL (no ACL)"
          ansible.builtin.shell: |
            echo "Denied message" | /opt/kafka/bin/kafka-console-producer.sh \
              --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }} \
              --topic failover-test \
              --producer.config {{ kafka_sasl_client_config }}
          become_user: kafka
          run_once: true
          register: produce_denied
          ignore_errors: true   # Cho phép chạy tiếp dù có lỗi

        - name: Assert produce was denied (no ACL)
          ansible.builtin.assert:
            that: "'TopicAuthorizationException' in produce_denied.stderr"
            fail_msg: "Produce succeeded without ACL - Security issue! (no TopicAuthorizationException in stderr)"
            success_msg: "Produce correctly denied due to missing ACL"
          run_once: true

        # TEST 2: Consume - EXPECT FAIL (no ACL)
        - name: "[TEST 2] Consume with testuser - EXPECT FAIL (no ACL)"
          ansible.builtin.shell: |
            timeout 10 /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }} \
              --topic failover-test --max-messages 1 \
              --consumer.config {{ kafka_sasl_client_config }} || true
          become_user: kafka
          run_once: true
          register: consume_denied
          ignore_errors: true
        
        - name: Assert consume was denied (no ACL)
          ansible.builtin.assert:
            that: "'TopicAuthorizationException' in consume_denied.stderr"
            fail_msg: "Consume succeeded without ACL - Security issue!"
            success_msg: "Consume correctly denied due to missing ACL"
          run_once: true

        # CẤP ACL CHO testuser CHỈ VỚI topic failover-test
        - name: Grant ACL to testuser - Topic operations (Read/Write/Describe)
          ansible.builtin.shell: >
            /opt/kafka/bin/kafka-acls.sh --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }}
            --command-config {{ kafka_sasl_admin_config }}
            --add --allow-principal User:{{ test_user }}
            --operation Read --operation Write --operation Describe
            --topic failover-test
          become_user: kafka
          run_once: true
          ignore_errors: true
        
        - name: Grant ACL to testuser - Consumer Group operations (Read/Describe on all groups)
          ansible.builtin.shell: >
            /opt/kafka/bin/kafka-acls.sh --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }}
            --command-config {{ kafka_sasl_admin_config }}
            --add --allow-principal User:{{ test_user }}
            --operation Read --operation Describe
            --group '*'
          become_user: kafka
          run_once: true
          ignore_errors: true

        # Bây giờ produce → PHẢI THÀNH CÔNG
        - name: "[TEST 3] Produce with testuser - EXPECT SUCCESS (with ACL)"
          ansible.builtin.shell: |
            set -o pipefail
            for i in {1..10}; do
              echo "Allowed message $i from {{ test_user }}" | /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }} \
                --topic failover-test \
                --producer.config {{ kafka_sasl_client_config }}
            done
          become_user: kafka
          run_once: true

        # Consume → THÀNH CÔNG
        - name: "[TEST 4] Consume with testuser - EXPECT SUCCESS (with ACL)"
          ansible.builtin.shell: |
            set -o pipefail
            /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }} \
              --topic failover-test --from-beginning --max-messages 10 \
              --consumer.config {{ kafka_sasl_client_config }}
          become_user: kafka
          run_once: true
          register: consume_allowed
          changed_when: false

        - name: Debug messages consumed by testuser
          ansible.builtin.debug:
            msg: "Messages consumed by {{ test_user }} (with ACL): {{ consume_allowed.stdout_lines }}"
      when: kafka_sasl_port is defined and kafka_sasl_mechanism.broker is defined

      # Cleanup luôn chạy nếu block SASL được thực thi
      always:
        - name: Cleanup - Delete testuser
          ansible.builtin.shell: |
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }} \
              --alter --delete-config 'SCRAM-SHA-512' \
              --entity-type users --entity-name {{ test_user }} \
              --command-config {{ kafka_sasl_admin_config }}
          become_user: kafka
          run_once: true
          ignore_errors: true
          when: kafka_sasl_port is defined

        - name: Cleanup - Remove ACLs for topic failover-test (all principals)
          ansible.builtin.shell: >
            /opt/kafka/bin/kafka-acls.sh --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }}
            --command-config {{ kafka_sasl_admin_config }}
            --remove --force
            --topic failover-test
          become_user: kafka
          run_once: true
          ignore_errors: true  # Idempotent: nếu không còn ACL nào thì báo lỗi nhưng ok

        - name: Cleanup - Remove ACLs for consumer groups (all groups, all principals)
          ansible.builtin.shell: >
            /opt/kafka/bin/kafka-acls.sh --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }}
            --command-config {{ kafka_sasl_admin_config }}
            --remove --force
            --group '*'
          become_user: kafka
          run_once: true
          ignore_errors: true

        - name: Cleanup - Delete test topic (admin)
          ansible.builtin.shell: |
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ ansible_host }}:{{ kafka_sasl_port }} \
              --delete --topic failover-test \
              --command-config {{ kafka_sasl_admin_config }}
          become_user: kafka
          run_once: true
          ignore_errors: true
          when: kafka_sasl_port is defined

        - name: Remove temporary SASL config files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ kafka_sasl_client_config }}"
            - "{{ kafka_sasl_admin_config }}"
          run_once: true
          when: kafka_sasl_port is defined
